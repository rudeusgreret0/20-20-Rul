name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate Debug Keystore (if not present)
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/20-20-Eye-Care-v1.0.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 20-20-Eye-Care-APK
          path: dist/20-20-Eye-Care-v1.0.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "20-20 Eye Care v1.0.0 (Direct APK Download)"
          body: |
            ## 20-20 Eye Care — Automatic 20-20-20 Reminder (Android APK)

            ### Direct Download
            Download **`20-20-Eye-Care-v1.0.apk`** below and install it on any Android 7.0+ (API 24+) device.

            ### Highlights
            - **Automatic 20-Minute Countdown:** Starts automatically and runs reliably in the background via a Foreground Service and `AlarmManager`.
            - **Audible Chimes & Actionable Notifications:** Stop the alarm, start your 20s/30s eye rest, pause, resume, or complete your rest directly from the notification shade or inside the app.
            - **Automatic Cycle Reset:** Immediately starts the next 20-minute cycle once your rest is acknowledged.
            - **Reboot Recovery:** Automatically restores active reminders after a device restart without duplicate alarms.
          files: dist/20-20-Eye-Care-v1.0.apk
          draft: false
          prerelease: false
          make_latest: "true"
